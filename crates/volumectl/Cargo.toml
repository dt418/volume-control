[package]
name = "volumectl"
version = "0.1.0"
edition = "2021"
description = "Native multiplatform volume controller with global hotkeys and overlay"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
pretty_env_logger = { workspace = true }
rdev = { workspace = true }

# Cross-platform system volume via platform-native APIs.
[target.'cfg(not(target_os = "windows"))'.dependencies]
volumecontrol = "0.1"

# Native AppKit renderer (spec §10.2): NSPanel/NSWindow surfaces, public
# material APIs via NSVisualEffectView, VoiceOver semantics. Pure-Rust FFI
# bindings; no C build. Compile-gated to macOS by the target section.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Native GTK4/libadwaita renderer (spec §10.3): GTK/libadwaita surfaces for
# Settings/Help, layer-shell overlay/mixer on Wayland, X11-compatible
# fallback. Optional so the plain CLI fallback still builds on Linux systems
# without GTK4 development packages; CI enables `gtk-renderer` (+
# `layer-shell`) on Ubuntu 24.04 where the system libraries exist.
# Version pairing: gtk4 0.8 + libadwaita 0.6 + gtk4-layer-shell 0.3 all
# resolve against gtk4-sys 0.8 (system GTK ≥ 4.0; Ubuntu 24.04 ships 4.14.1
# and libadwaita 1.4.0, both satisfied).
[features]
default = []
gtk-renderer = ["dep:gtk4", "dep:libadwaita"]
layer-shell = ["dep:gtk4-layer-shell", "gtk-renderer"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
gtk4 = { version = "0.8", optional = true }
libadwaita = { version = "0.6", optional = true }
gtk4-layer-shell = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }
tray-icon = { workspace = true }
muda = { workspace = true }

[lib]
name = "volumectl_lib"
path = "src/lib.rs"

[[bin]]
name = "volumectl"
path = "src/main.rs"

# macOS AppKit smoke test: `harness = false` so its `main()` runs on the
# process main thread — AppKit requires the main thread, and libtest would
# run the body on a worker thread. The body is gated to `target_os = "macos"`
# inside the file; on other targets the binary compiles as a no-op.
[[test]]
name = "appkit_smoke"
path = "tests/appkit_smoke.rs"
harness = false

# macOS host smoke test: the host and AppKit renderer are both main-thread-only.
[[test]]
name = "macos_host_smoke"
path = "tests/macos_host_smoke.rs"
harness = false

# Ubuntu GTK4/libadwaita smoke test: same harness-free main-thread pattern
# (GTK panics off the main thread). `required-features` keeps the target out
# of builds without the renderer feature; CI runs it under `xvfb-run`.
[[test]]
name = "gtk_smoke"
path = "tests/gtk_smoke.rs"
harness = false
required-features = ["gtk-renderer"]
# Linux host-loop smoke test: main-thread GTK/GLib action routing and teardown.
[[test]]
name = "linux_host_smoke"
path = "tests/linux_host_smoke.rs"
harness = false
required-features = ["gtk-renderer"]
