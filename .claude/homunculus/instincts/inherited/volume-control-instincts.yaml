# Volume Control Naming Rust

## Action

Use snake_case for Rust files, modules, functions, and methods; PascalCase for types, structs, traits, and enums; SCREAMING_SNAKE_CASE for constants

## Evidence

- Rust 2021 conventions enforced by rustfmt and clippy across crates/volumectl and src-tauri

