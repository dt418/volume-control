# Volume Control Safe Flow

## Action

Never run destructive git operations (push origin directly, push --force, reset --hard, clean -fd, checkout ., restore .); use scripts/ship.sh or scripts/ship.ps1

## Evidence

- .claude/hooks/agent-safe-flow.sh pre-tool bash hook blocks destructive git commands
- Verified by scripts/test-agent-safe-flow.sh

