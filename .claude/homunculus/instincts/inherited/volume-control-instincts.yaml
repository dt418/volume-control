# Volume Control Quality Gate

## Action

Run cargo fmt --all --check, git diff --check, cargo clippy --workspace --all-targets --no-default-features -- -D warnings, and cargo test

## Evidence

- Root AGENTS.md format-and-lint gate
- scripts/format-lint.sh and scripts/format-lint.ps1

