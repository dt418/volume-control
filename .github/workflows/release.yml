# Promote only the SHA-bound artifacts produced by desktop-validation.yml.
# The reusable desktop validation remains mandatory for tag/manual releases;
# the pull-request-only Linux/macOS skip applies only to ci.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
    steps:
      - name: Resolve and validate release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$release_tag' must match vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi

          # Bind both tag pushes and manual dispatches to the exact commit
          # selected by this workflow run. A manually entered tag must not be
          # allowed to publish artifacts from a different commit.
          tag_type=""
          tag_sha=""
          tag_ref="repos/$REPOSITORY/git/ref/tags/$release_tag"
          if ! tag_type_and_sha="$(gh api "$tag_ref" --jq '.object.type + " " + .object.sha')"; then
            echo "Release tag $release_tag does not exist on the remote." >&2
            echo "Create it at the exact commit to release, push it, and the workflow triggers automatically:" >&2
            echo "  git tag -a $release_tag -m \"Release $release_tag\" && git push origin $release_tag" >&2
            exit 1
          fi
          read -r tag_type tag_sha <<< "$tag_type_and_sha"
          for _ in 1 2 3; do
            if [ "$tag_type" = "commit" ]; then break; fi
            if [ "$tag_type" != "tag" ] || [ -z "$tag_sha" ]; then
              echo "Release tag $release_tag did not resolve to a commit" >&2
              exit 1
            fi
            if ! tag_type_and_sha="$(gh api "repos/$REPOSITORY/git/tags/$tag_sha" --jq '.object.type + " " + .object.sha')"; then
              echo "Unable to dereference annotated release tag $release_tag" >&2
              exit 1
            fi
            read -r tag_type tag_sha <<< "$tag_type_and_sha"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$EXPECTED_COMMIT_SHA" ]; then
            echo "Release tag $release_tag resolves to ${tag_sha:-unknown}, expected $EXPECTED_COMMIT_SHA" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate desktop artifacts
    needs: preflight
    uses: ./.github/workflows/desktop-validation.yml
    with:
      release_mode: true
      release_tag: ${{ needs.preflight.outputs.release_tag }}
    secrets: inherit

  publish:
    name: Create GitHub release
    needs: [preflight, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: validated-*-${{ github.sha }}
          merge-multiple: false
      - name: Verify and stage release assets
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          rm -rf release-assets
          mkdir release-assets
          declare -A seen_names=()
          for platform in windows macos ubuntu; do
            artifact_dir="dist/validated-${platform}-${EXPECTED_COMMIT_SHA}"
            test -d "$artifact_dir"
            bash scripts/verify-release-metadata.sh "$artifact_dir" "$EXPECTED_COMMIT_SHA" "$platform"
            # Only manifest-declared files are staged; the per-platform
            # SHA256SUMS.txt is never itself a manifest input.
            while IFS= read -r manifest_line; do
              manifest_line="${manifest_line%$'\r'}"
              name="${manifest_line#*  }"
              test -n "$name"
              if [ -n "${seen_names[$name]:-}" ]; then
                echo "duplicate release basename: $name" >&2
                exit 1
              fi
              seen_names[$name]=1
              test -s "$artifact_dir/$name"
              cp "$artifact_dir/$name" "release-assets/$name"
            done < "$artifact_dir/SHA256SUMS.txt"
          done
          ls -la release-assets
      - name: Generate release checksums
        shell: bash
        run: |
          # Flat staging is the checksum universe: sorted basenames only,
          # never CI paths, and the manifest excludes itself deterministically
          # because its input list is snapshotted before the file is created.
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -size +0c -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.ps1' -size +0c -print -quit)"
          staged_names="$(cd release-assets && ls -1 | LC_ALL=C sort)"
          test -n "$staged_names"
          (cd release-assets && sha256sum $staged_names \
            | sed -E 's/^([0-9a-fA-F]{64}) [*] ?/\1  /' > SHA256SUMS.txt)
          test -s release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt
      - name: Create or upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -d '' release_assets < <(
            find release-assets -maxdepth 1 -type f -print0 | sort -z
          )
          test "${#release_assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # No overwrite flag: existing assets fail this upload instead of
            # mutating published bytes.
            echo "Release $RELEASE_TAG already exists; uploading immutable assets."
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" \
              --title "VolumeControl $RELEASE_TAG" --generate-notes
          fi
