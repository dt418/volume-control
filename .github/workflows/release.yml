# Release packaging for VolumeControl.
#
# Triggered by a `v*` tag or from the Actions UI. Each platform builds its
# release binary and packs it into `dist/` via scripts/package.sh (versioned
# name + SHA256SUMS.txt); a final job assembles the GitHub release from every
# artifact.
#
# Platform notes:
# - Windows: portable zip (native installer arrives with a follow-on
#   packaging task; the artifact is the signed-ready exe + docs).
# - macOS: zip of the release binary.
# - Ubuntu 24.04: tar.gz of the release binary built with the GTK4/
#   libadwaita renderer, plus the optional Wayland layer-shell feature when
#   the system library is installed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos, ubuntu]
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15
          - platform: ubuntu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK4/libadwaita (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libpulse-dev zip
          # GTK4 layer-shell is optional. Probe before installing so Ubuntu
          # releases without the package use the X11 fallback cleanly.
          if apt-cache show libgtk4-layer-shell-dev >/dev/null 2>&1; then
            sudo apt-get install -y libgtk4-layer-shell-dev
          else
            echo "GTK4 layer-shell development package unavailable; release uses the X11 fallback."
          fi
      - name: Build release binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            FEATURES="gtk-renderer"
            if pkg-config --exists gtk4-layer-shell-0; then FEATURES="gtk-renderer,layer-shell"; fi
            echo "Building with features: $FEATURES"
            cargo build --release --features "$FEATURES"
          else
            cargo build --release
          fi
      - name: Package artifacts
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.release_tag }}
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          find . -type f | sort | while read -r f; do
            if [ "${f##*.}" != "txt" ]; then sha256sum "$f"; fi
          done | tee SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "VolumeControl $RELEASE_TAG" \
            --generate-notes
