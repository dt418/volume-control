# Promote only the SHA-bound artifacts produced by desktop-validation.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
    steps:
      - name: Resolve and validate release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          release_tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate desktop artifacts
    needs: preflight
    uses: ./.github/workflows/desktop-validation.yml
    with:
      release_mode: true
      release_tag: ${{ needs.preflight.outputs.release_tag }}
    secrets: inherit

  publish:
    name: Create GitHub release
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: validated-*-${{ github.sha }}
          merge-multiple: false
      - name: Verify every validated artifact
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          for platform in windows macos ubuntu; do
            artifact_dir="dist/validated-${platform}-${EXPECTED_COMMIT_SHA}"
            test -d "$artifact_dir"
            bash scripts/verify-release-metadata.sh "$artifact_dir" "$EXPECTED_COMMIT_SHA" "$platform"
          done
      - name: Generate release checksums
        shell: bash
        run: |
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' artifact; do sha256sum "$artifact"; done \
            > dist/SHA256SUMS.txt
          test -s dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -d '' release_assets < <(
            find dist -type f \
              \( -name '*.zip' -o -name '*.tar.gz' \) \
              -print0 | sort -z
          )
          release_assets+=(dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading refreshed assets."
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" \
              --title "VolumeControl $RELEASE_TAG" --generate-notes
          fi
