# CI matrix for the VolumeControl Signal Glass UI.
#
# Windows: build + full test suite + release artifact validation.
# macOS: build + tests (AppKit renderer smoke tests dispatch to the real
#   main thread via GCD).
# Ubuntu 24.04: CLI fallback build/test with no features, then the GTK4/
#   libadwaita renderer build and smoke tests under Xvfb, and the optional
#   Wayland layer-shell build when the system library is available.
#
# A shared "checks" job runs formatting, whitespace, and forbidden-diff gates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, diff gate, CLI fallback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Codex coordinator contract
        run: python scripts/test-codex-config.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux & Tauri dependencies (webview surfaces)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config libx11-dev libasound2-dev \
            libpulse-dev libxi-dev libxtst-dev
      - name: Frontend build + tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (clippy, no GTK features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Diff hygiene (whitespace + forbidden paths)
        run: bash scripts/ci-diff-check.sh
      - name: Build (no GTK features — CLI fallback)
        run: cargo build
      - name: Test (no GTK features)
        run: cargo test
      - name: Smoke-test format-lint gates
        run: bash scripts/test-format-lint.sh
      - name: Record-keeping guard (branch change set)
        run: bash scripts/check-records.sh --branch
      - name: Smoke-test record-keeping guard
        run: bash scripts/test-check-records.sh
      - name: Smoke-test ship-flow wiring
        run: bash scripts/test-ship.sh

  windows:
    name: Windows (build + tests + release artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install isolated Tauri E2E dependencies
        working-directory: e2e/tauri
        run: npm ci
      - name: Run Windows Tauri WebDriver E2E (release gate)
        shell: pwsh
        env:
          E2E_DRIVER_PROVIDER: embedded
        run: ./scripts/verify-tauri-e2e.ps1 -Surface all -OutputRoot output/tauri-e2e/ci-windows
      - name: Upload Windows Tauri E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-e2e-windows
          path: |
            output/tauri-e2e/ci-windows/**/junit
            output/tauri-e2e/ci-windows/**/manifest.json
            output/tauri-e2e/ci-windows/**/timings.json
            output/tauri-e2e/ci-windows/**/screenshot.png
            output/tauri-e2e/ci-windows/**/accessibility-snapshot.json
            output/tauri-e2e/ci-windows/**/logs
          if-no-files-found: error
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Smoke-test format-lint gates
        shell: bash
        run: bash scripts/test-format-lint.sh
      - name: Smoke-test record-keeping guard
        shell: bash
        run: bash scripts/test-check-records.sh
      - name: Build release Tauri host and validate artifact
        shell: bash
        run: |
          npm --prefix frontend run build
          frontend/node_modules/.bin/tauri build --no-bundle --ci
          test -s target/release/VolumeControl.exe && echo "VolumeControl.exe present and non-empty"
          ls -la target/release/VolumeControl.exe
          file target/release/VolumeControl.exe || true

  macos:
    name: macOS (build + tests + renderer smoke)
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install isolated Tauri E2E dependencies
        working-directory: e2e/tauri
        run: npm ci
      - name: Run macOS Tauri WebDriver E2E
        shell: bash
        env:
          E2E_DRIVER_PROVIDER: embedded
        run: bash scripts/verify-tauri-e2e.sh --surface all --output-root output/tauri-e2e/ci-macos
      - name: Upload macOS Tauri E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-e2e-macos
          path: |
            output/tauri-e2e/ci-macos/**/junit
            output/tauri-e2e/ci-macos/**/manifest.json
            output/tauri-e2e/ci-macos/**/timings.json
            output/tauri-e2e/ci-macos/**/screenshot.png
            output/tauri-e2e/ci-macos/**/accessibility-snapshot.json
            output/tauri-e2e/ci-macos/**/logs
          if-no-files-found: error
      - name: Build
        run: cargo build
      - name: Test (includes AppKit renderer smoke tests)
        run: cargo test
      - name: Build release Tauri host and validate artifact
        shell: bash
        run: |
          npm --prefix frontend run build
          frontend/node_modules/.bin/tauri build --no-bundle --ci
          test -s target/release/VolumeControl && echo "VolumeControl present and non-empty"
          ls -la target/release/VolumeControl
          file target/release/VolumeControl
      - name: Package macOS app bundle (validation)
        shell: bash
        env:
          RELEASE_PLATFORM: macos
          RELEASE_TAG: v0.0.0-ci
        run: bash scripts/package.sh
      - name: Verify the macOS app bundle
        shell: bash
        run: |
          unzip -l dist/volumecontrol-0.0.0-ci-macos.zip | grep -q "VolumeControl.app/Contents/Info.plist"
          unzip -l dist/volumecontrol-0.0.0-ci-macos.zip | grep -q "VolumeControl.app/Contents/MacOS/volumectl"
          tmp="dist/verify-$$"
          mkdir -p "$tmp"
          unzip -q dist/volumecontrol-0.0.0-ci-macos.zip -d "$tmp"
          codesign --verify --strict "$tmp/VolumeControl.app"
          plutil -lint "$tmp/VolumeControl.app/Contents/Info.plist"
          rm -rf "$tmp"

  ubuntu:
    name: Ubuntu 24.04 (GTK4/libadwaita + layer-shell)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK4/libadwaita/Xvfb + Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libpulse-dev libx11-dev libxi-dev libxtst-dev xvfb
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev
          # GTK4 layer-shell is optional. Ubuntu 24.04 may not provide the
          # development package yet, so probe before installing and use the
          # X11 fallback without raising a CI warning when it is unavailable.
          if apt-cache show libgtk4-layer-shell-dev >/dev/null 2>&1; then
            sudo apt-get install -y libgtk4-layer-shell-dev
          else
            echo "GTK4 layer-shell development package unavailable; using the X11 fallback."
          fi
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install isolated Tauri E2E dependencies
        working-directory: e2e/tauri
        run: npm ci
      - name: Run Linux Tauri WebDriver E2E under Xvfb
        env:
          E2E_DRIVER_PROVIDER: embedded
        run: xvfb-run -a bash scripts/verify-tauri-e2e.sh --surface all --output-root output/tauri-e2e/ci-linux
      - name: Upload Linux Tauri E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-e2e-linux
          path: |
            output/tauri-e2e/ci-linux/**/junit
            output/tauri-e2e/ci-linux/**/manifest.json
            output/tauri-e2e/ci-linux/**/timings.json
            output/tauri-e2e/ci-linux/**/screenshot.png
            output/tauri-e2e/ci-linux/**/accessibility-snapshot.json
            output/tauri-e2e/ci-linux/**/logs
          if-no-files-found: error
      - name: Build (no features — CLI fallback)
        run: cargo build
      - name: Test (no features — pure planning)
        run: cargo test
      - name: Build (gtk-renderer)
        run: cargo build --features gtk-renderer
      - name: Test (gtk-renderer smoke under Xvfb)
        run: xvfb-run -a cargo test --features gtk-renderer
      - name: Build (gtk-renderer + layer-shell when available)
        run: |
          if pkg-config --exists gtk4-layer-shell-0; then
            cargo build --features gtk-renderer,layer-shell
          else
            echo "GTK4 layer-shell library unavailable; optional layer-shell build skipped."
          fi
      - name: Build release Tauri host and validate artifact (FE + BE)
        shell: bash
        run: |
          npm --prefix frontend run build
          frontend/node_modules/.bin/tauri build --no-bundle --ci
          test -s target/release/VolumeControl && echo "VolumeControl present and non-empty"
          ls -la target/release/VolumeControl
          file target/release/VolumeControl
