name: Egui release artifacts

# Builds the native installer/portable packages for the egui host.
# Artifacts are always uploaded to the workflow run. On tags they are attached
# to the GitHub release only when the repository variable
# EGUI_RELEASE_PUBLISH=true (flip after a dry run + signing decision), so the
# existing Tauri release remains authoritative until the cutover is verified.

on:
  push:
    # `egui-dryrun-*` tags exercise packaging without triggering the Release
    # workflow (which only accepts semver v* tags and fails closed otherwise).
    tags: ["v*", "egui-dryrun-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (defaults to tauri.conf.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: pwsh -File scripts/package-egui.ps1
            artifact: egui-windows
          - os: ubuntu-24.04
            script: bash scripts/package-egui.sh
            artifact: egui-linux
          - os: macos-15
            script: bash scripts/package-egui.sh
            artifact: egui-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          raw=""
          if [[ -n "${{ inputs.version }}" ]]; then
            raw="${{ inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            raw="${GITHUB_REF_NAME#v}"
          fi
          # Accept dry-run tags by extracting the numeric semver core.
          numeric="$(printf '%s' "$raw" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [[ -n "$numeric" ]]; then
            value="$numeric"
          elif [[ -n "$raw" ]]; then
            value="$raw"
          else
            value=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            libpulse-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-x11-0 rpm
      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile with NO signing material in the environment: dependency build
      # scripts must never see certificates or private keys.
      - name: Compile host
        shell: bash
        run: cargo build --release -p volumecontrol-egui
      - name: Package and sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_ALLOW_UNTRUSTED_SIGNATURE: ${{ secrets.WINDOWS_ALLOW_UNTRUSTED_SIGNATURE }}
          REQUIRE_SIGNING: ${{ vars.EGUI_RELEASE_PUBLISH }}
        run: |
          pwsh -File scripts/package-egui.ps1 `
            "${{ steps.version.outputs.value }}" -SkipBuild
      - name: Package and sign (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          REQUIRE_SIGNING: ${{ vars.EGUI_RELEASE_PUBLISH }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY_BASE64" ]]; then
            printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
          fi
          SKIP_BUILD=1 bash scripts/package-egui.sh "${{ steps.version.outputs.value }}"
      - name: Package and sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_DISABLED: ${{ vars.MACOS_SIGNING_DISABLED }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          REQUIRE_SIGNING: ${{ vars.EGUI_RELEASE_PUBLISH }}
        run: SKIP_BUILD=1 bash scripts/package-egui.sh "${{ steps.version.outputs.value }}"
      - name: Verify artifacts
        shell: bash
        run: |
          ls -la output/egui
          test -f output/egui/SHA256SUMS.txt
          compgen -G "output/egui/*" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            output/egui/*.exe
            output/egui/*.zip
            output/egui/*.tar.gz
            output/egui/*.dmg
            output/egui/*.deb
            output/egui/*.rpm
            output/egui/*.AppImage
            output/egui/SHA256SUMS.txt
            output/egui/SHA256SUMS.txt.asc
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/') && vars.EGUI_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Refuse untrusted artifacts unless waived
        env:
          TAG: ${{ github.ref_name }}
          UNTRUSTED_WINDOWS: ${{ secrets.WINDOWS_ALLOW_UNTRUSTED_SIGNATURE }}
          MACOS_DISABLED: ${{ vars.MACOS_SIGNING_DISABLED }}
          ALLOW_UNTRUSTED_RELEASE: ${{ vars.ALLOW_UNTRUSTED_RELEASE }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is a dry run; skipping trust check."
            exit 0
          fi
          if [[ "$UNTRUSTED_WINDOWS" == "true" || "$MACOS_DISABLED" == "true" ]]; then
            if [[ "$ALLOW_UNTRUSTED_RELEASE" != "true" ]]; then
              echo "Refusing to publish: Windows uses a self-signed certificate and/or macOS is unsigned." >&2
              echo "Replace them with a trusted certificate/Developer ID, or set ALLOW_UNTRUSTED_RELEASE=true explicitly." >&2
              exit 1
            fi
          fi
      - name: Upload native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is a dry run (not semver); skipping release upload."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == *-unt.* ]]; then
              gh release create "$TAG" --prerelease --latest=false \
                --title "VolumeControl $TAG (untrusted egui build)" \
                --notes "UNTRUSTED build: the Windows installer is self-signed, the macOS app is ad-hoc signed, and the Linux checksums are GPG-signed. Do not use for general distribution."
            else
              gh release create "$TAG" --latest \
                --title "VolumeControl $TAG" \
                --notes "Free egui build. Signatures are not trusted yet: the Windows installer is self-signed, the macOS app is ad-hoc signed, and the Linux checksums are GPG-signed. Windows SmartScreen and macOS Gatekeeper will warn until purchase-backed certificates are configured."
            fi
          fi
          mkdir -p release
          find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp -n {} release/ \;
          find dist -type f -name 'SHA256SUMS.txt' -print0 |
            xargs -0 cat | tr -d '\r' | sort -u > release/SHA256SUMS.txt
          if [[ -n "$GPG_KEY_ID" && -n "$GPG_PRIVATE_KEY_BASE64" ]]; then
            printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
            gpg --batch --yes --armor --detach-sign -u "$GPG_KEY_ID" release/SHA256SUMS.txt
          fi
          failed=0
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded=true
                break
              fi
              echo "upload failed for $base (attempt $attempt); retrying" >&2
              sleep 3
            done
            if [[ "$uploaded" != true ]]; then
              echo "could not upload $base" >&2
              failed=1
            fi
          done < <(find release -type f -print0)
          exit "$failed"
