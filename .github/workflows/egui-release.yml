name: Egui release artifacts

# Builds the native installer/portable packages for the egui host.
# Artifacts are always uploaded to the workflow run. On tags they are attached
# to the GitHub release only when the repository variable
# EGUI_RELEASE_PUBLISH=true (flip after a dry run + signing decision), so the
# existing Tauri release remains authoritative until the cutover is verified.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (defaults to tauri.conf.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: pwsh -File scripts/package-egui.ps1
            artifact: egui-windows
          - os: ubuntu-24.04
            script: bash scripts/package-egui.sh
            artifact: egui-linux
          - os: macos-15
            script: bash scripts/package-egui.sh
            artifact: egui-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-xcb-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            libpulse-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Import GPG key (Linux)
        if: runner.os == 'Linux' && env.GPG_PRIVATE_KEY_BASE64 != ''
        shell: bash
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
      - name: Package
        shell: bash
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: ${{ matrix.script }} "${{ steps.version.outputs.value }}"
      - name: Verify artifacts
        shell: bash
        run: |
          ls -la output/egui
          test -f output/egui/SHA256SUMS.txt
          compgen -G "output/egui/*" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            output/egui/*.exe
            output/egui/*.zip
            output/egui/*.tar.gz
            output/egui/SHA256SUMS.txt
            output/egui/SHA256SUMS.txt.asc
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/') && vars.EGUI_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist -type f \( -name 'VolumeControl*' -o -name 'volumecontrol-*' \
          -o -name 'SHA256SUMS.txt' -o -name 'SHA256SUMS.txt.asc' \) -print0 |
            xargs -0 gh release upload "$TAG" --clobber
