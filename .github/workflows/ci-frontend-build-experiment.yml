name: CI frontend build experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-build-without-explicit-frontend-build:
    name: Tauri build without explicit frontend build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-15
          - platform: ubuntu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxi-dev libxtst-dev

      - name: Install frontend dependencies only
        working-directory: frontend
        run: npm ci

      # Intentionally no `npm run build` here. Tauri's beforeBuildCommand
      # must create frontend/dist as part of `tauri build`.
      - name: Assert frontend dist does not exist before Tauri build
        shell: bash
        run: test ! -d frontend/dist

      - name: Build Tauri host
        shell: bash
        run: frontend/node_modules/.bin/tauri build --no-bundle --ci

      - name: Assert beforeBuildCommand produced frontend dist
        shell: bash
        run: test -d frontend/dist && test -n "$(find frontend/dist -type f -print -quit)"

      - name: Assert release host exists (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: test -s target/release/VolumeControl.exe

      - name: Assert release host exists (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: test -s target/release/VolumeControl
