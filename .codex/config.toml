approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[mcp_servers.github]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp@latest",
]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-memory",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
    "--extension",
]

[mcp_servers.sequential-thinking]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 2

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[agents.planner]
description = "Read-only delivery planner that turns approved goals into an evidence-backed implementation plan."
config_file = "agents/planner.toml"

[agents.implementer]
description = "Workspace implementation agent that owns the approved plan, tests changes, and preserves unrelated work."
config_file = "agents/implementer.toml"

[agents.release_reviewer]
description = "Read-only release gate reviewer for correctness, security, UI/UX, performance, and cross-platform regressions."
config_file = "agents/release-reviewer.toml"

[agents.coordinator]
description = "Read-only delivery coordinator that decomposes work, assigns role handoffs, and enforces release evidence."
config_file = "agents/coordinator.toml"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "900000"
CLAUDE_AUTOCOMPACT_PCT_OVERRIDE = "90"
